name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # This project has no third-party npm dependencies to install.
      - name: Check committed files for credentials
        run: npm run security:check
      - name: Validate committed build and wiki
        run: npm run check
      - name: Rebuild deployment files
        run: npm run build
      - name: Verify generated files are committed
        run: git diff --exit-code -- dist
      - name: Test API and knowledge boundaries
        run: npm test
